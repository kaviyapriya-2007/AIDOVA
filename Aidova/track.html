<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Tracking</title>

<link rel="stylesheet" href="style.css">

<style>
#map {
    height: 300px;
    border-radius: 15px;
    margin-top: 20px;
}
</style>

</head>

<body>

<header class="header">
    Live Ambulance Tracking 🚑
</header>

<div class="container">

    <div class="card">

        <h2>Ambulance is on the way</h2>
        <p>Tracking live location...</p>

        <div id="map"></div>

        <br>

        <button class="book-btn" onclick="alert('Driver Contacted 📞')">
            Call Driver
        </button>

    </div>

</div>

<script>
function initMap() {

    const ambulance = {
        lat: 13.0827,
        lng: 80.2707
    };

    const map = new google.maps.Map(document.getElementById("map"), {
        zoom: 15,
        center: ambulance
    });

    new google.maps.Marker({
        position: ambulance,
        map: map,
        title: "Ambulance"
    });

}
</script>

<script async
src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAzd6kVGv_ZHiU5LG7yUJlITFUQkUB1phg&callback=initMap">
</script>

</body>
</html>
