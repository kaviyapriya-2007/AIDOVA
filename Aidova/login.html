<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Login</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

 <body>

 <header class="header">

 <div class="logo">

 <i class="fa-solid fa-truck-medical"></i>

 <h1>Ambulance Booking</h1>

 </div>

</header>

<div class="container">

    <div class="card">
         <div class="profile">
              <img src="https://i.imgur.com/7D7I6dI.png" alt="User">
                  </div>
    <div class="heartbeat">

         <i class="fa-solid fa-heart-pulse"></i>

             </div>

<div class="profile">

<img src="">

</div>

        <h2 style="text-align:center;">Welcome Back</h2>

        <br>

        <input type="text" id="username" placeholder="Username">

        <br>

        <div class="password-box">
           <input type="password" id="password" placeholder="Password">
             <i class="fa-solid fa-eye" onclick="togglePassword()"></i>
                  </div>

        <br><br>

        <button class="book-btn" onclick="loginUser()">
            Login
        </button>

    </div>

</div>

<script>

function loginUser(){

    let user=document.getElementById("username").value;
    let pass=document.getElementById("password").value;

    if(user=="Yadhaev" && pass=="1234")
    {
        alert("Login Successful!");
        window.location.href="home.html";
    }
    else
    {
        alert("Invalid Username or Password");
    }

}

</script>
<script>
function togglePassword() {

    let pass = document.getElementById("password");

    if (pass.type === "password") {
        pass.type = "text";
    } else {
        pass.type = "password";
    }

}
</script>
<button onclick="darkMode()" class="mode-btn">

🌙

</button>

<script>

function darkMode(){

document.body.classList.toggle("dark");

}

</script>

</body>
</html>
